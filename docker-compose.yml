services:
  # PostgreSQL Database
  postgres:
    image: pgvector/pgvector:pg15
    container_name: heimdall-postgres
    environment:
      POSTGRES_DB: heimdall
      POSTGRES_USER: heimdall
      POSTGRES_PASSWORD: heimdall_secure_2026
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heimdall"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Ollama for Local LLMs
  ollama:
    image: ollama/ollama:latest
    container_name: heimdall-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=0.0.0.0

  # Redis for Caching & Task Queue
  redis:
    image: redis:7-alpine
    container_name: heimdall-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Langfuse (Observability) - Optional, can remove if issues
  langfuse:
    image: langfuse/langfuse:latest
    container_name: heimdall-langfuse
    ports:
      - "3001:3000"
    environment:
      - DATABASE_URL=postgresql://heimdall:heimdall_secure_2026@postgres:5432/heimdall
      - NEXTAUTH_SECRET=change-me-in-production
      - SALT=change-me-in-production
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:
  redis_data:
